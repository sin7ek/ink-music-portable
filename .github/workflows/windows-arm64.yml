name: Windows ARM64 portable (experimental)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-arm64
    paths:
      - ".github/workflows/windows-arm64.yml"
      - "desktop/**"
      - "core/**"
      - "youtube/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "app/build.gradle.kts"

permissions:
  contents: read

jobs:
  arm64:
    name: Build native Windows ARM64 ZIP
    runs-on: windows-11-arm
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native ARM64 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"
          architecture: aarch64

      - name: Validate Java architecture and tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & java -XshowSettings:properties -version 2>&1 | Out-String | Write-Host
          $arch = (& java -XshowSettings:properties -version 2>&1 | Select-String 'os.arch =').ToString()
          if ($arch -notmatch 'aarch64|arm64') { throw "Expected native ARM64 Java, got: $arch" }
          if (!(Test-Path "$env:JAVA_HOME/bin/jpackage.exe")) { throw 'JDK jpackage.exe is missing' }

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download native ARM64 libmpv
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Invoke-RestMethod 'https://api.github.com/repos/zhongfly/mpv-winbuild/releases/latest' -Headers @{ 'User-Agent' = 'INK-Music-ARM64-CI' }
          $asset = $release.assets | Where-Object { $_.name -match '^mpv-dev-aarch64-.*\.7z$' } | Select-Object -First 1
          if (!$asset) { throw 'No mpv-dev-aarch64 release archive found; refusing to substitute x64' }
          New-Item -ItemType Directory -Force 'build/mpv-arm64' | Out-Null
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile 'build/mpv-arm64/libmpv.7z'
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (!$sevenZip) { $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }
          if (!(Test-Path $sevenZip)) { throw '7-Zip is unavailable on Windows ARM64 runner' }
          & $sevenZip x 'build/mpv-arm64/libmpv.7z' '-obuild/mpv-arm64/unpacked' -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract ARM64 libmpv archive' }
          $dll = Get-ChildItem 'build/mpv-arm64/unpacked' -Recurse -File -Filter 'libmpv-2.dll' | Select-Object -First 1
          if (!$dll) { throw 'Native ARM64 libmpv-2.dll not found' }
          # Read the PE machine field: 0xAA64 = ARM64; 0x8664 = x64.
          $bytes = [IO.File]::ReadAllBytes($dll.FullName)
          $offset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $offset + 4)
          if ($machine -ne 0xAA64) { throw ("libmpv is not ARM64 (PE machine 0x{0:X4})" -f $machine) }
          # Compose platform directories vary in architecture naming; cover both.
          foreach ($archName in @('windows-arm64', 'windows-aarch64')) {
            $dir = "desktop/native/$archName"
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item $dll.FullName "$dir/libmpv-2.dll"
          }
          Write-Host "ARM64 libmpv: $($asset.name); SHA256 $((Get-FileHash $dll.FullName -Algorithm SHA256).Hash)"

      - name: Build ARM64 desktop app image
        shell: pwsh
        run: |
          ./gradlew.bat :desktop:createDistributable -PdesktopOnly --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { throw 'Native ARM64 Compose build failed' }

      - name: Validate native architecture and make ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'desktop/build/compose/binaries/main/app/ink music'
          if (!(Test-Path "$app/ink music.exe")) { throw 'App launcher missing' }
          # jpackage's trimmed runtime can omit java.exe; the JVM runtime DLL is the
          # actual requirement. Inspect the layout to make failures actionable.
          Write-Host 'Application image files:'
          Get-ChildItem $app -Depth 2 | Select-Object -ExpandProperty FullName | Select-Object -First 120 | Out-Host
          if (!(Test-Path "$app/runtime")) { throw 'Bundled Java runtime directory missing' }
          $jvm = Get-ChildItem "$app/runtime" -Filter 'jvm.dll' -File -Recurse | Select-Object -First 1
          if (!$jvm) { throw 'Bundled Java runtime is missing jvm.dll' }
          function AssertArm64([string] $path) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $path).Path)
            $offset = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $offset + 4)
            if ($machine -ne 0xAA64) { throw ("Not native ARM64: $path (0x{0:X4})" -f $machine) }
          }
          AssertArm64 "$app/ink music.exe"
          AssertArm64 $jvm.FullName
          $mpv = Get-ChildItem $app -Filter 'libmpv-2.dll' -File -Recurse | Select-Object -First 1
          if (!$mpv) { throw 'ARM64 libmpv was not bundled in the Compose application image' }
          AssertArm64 $mpv.FullName
          # ARM64 rendering must not include x64 ANGLE libraries.
          if (Get-ChildItem "$app/app" -Filter 'libEGL.dll' -Recurse -ErrorAction SilentlyContinue) {
            throw 'x64 ANGLE DLL unexpectedly present in ARM64 build'
          }
          New-Item -ItemType Directory -Force 'build/arm64-portable' | Out-Null
          Copy-Item $app 'build/arm64-portable/INK-Music-ARM64' -Recurse
          @'
          INK Music native Windows ARM64 test build
          =========================================
          For Windows 11 on ARM (e.g. Snapdragon X Plus / Elite).
          Run "ink music.exe" directly; no MSI installation needed.
          Requires no x64 emulation for the launcher, Java runtime, or libmpv.
          This build is EXPERIMENTAL and is not yet fully data-portable:
          settings and caches may remain under %APPDATA%\ink music.
          Navidrome playback must be tested; native ARM64 is not a guaranteed fix.
          Unofficial fork of inkappdev/ink-music (GPL-3.0).
          '@ | Set-Content 'build/arm64-portable/INK-Music-ARM64/README-ARM64.txt'
          $match = Select-String -Path 'app/build.gradle.kts' -Pattern 'versionName = "([^"]+)"' | Select-Object -First 1
          $version = if ($match) { $match.Matches[0].Groups[1].Value } else { 'dev' }
          $zip = "build/INK-Music-$version-Windows-ARM64-Portable.zip"
          Compress-Archive -Path 'build/arm64-portable/INK-Music-ARM64' -DestinationPath $zip -CompressionLevel Optimal
          "ARCHIVE=$zip" >> $env:GITHUB_ENV
          Get-FileHash $zip -Algorithm SHA256 | Format-List

      - name: Upload ARM64 portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: INK-Music-Windows-ARM64-Portable
          path: ${{ env.ARCHIVE }}
          retention-days: 14
          if-no-files-found: error
